name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover tests -v
      - name: Web scripts parse
        run: for f in web/*.js; do node --check "$f"; done
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n uninstall.sh

  # The stations follow the `stable` branch. It only moves once the tests above passed.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move stable to this commit
        run: git push --force origin "HEAD:refs/heads/stable"
